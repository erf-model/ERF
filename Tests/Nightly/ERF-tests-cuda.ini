[main]
testTopDir     = /home/regtester/RegTesting/rt-ERF/
webTopDir      = /home/regtester/RegTesting/rt-ERF/web

useCmake = 0

sourceTree = C_Src

plot_file_name = erf.plot_file_1
check_file_name = erf.check_file

# suiteName is the name prepended to all output directories
suiteName = ERF-GPU

COMP = g++
FCOMP = gfortran
add_to_c_make_command = TEST=TRUE USE_ASSERTION=TRUE USE_CUDA=TRUE

purge_output = 1

MAKE = make
numMakeJobs = 8

# MPIcommand should use the placeholders:
#   @host@ to indicate where to put the hostname to run on
#   @nprocs@ to indicate where to put the number of processors
#   @command@ to indicate where to put the command to run
#
# only tests with useMPI = 1 will run in parallel
# nprocs is problem dependent and specified in the individual problem
# sections.

#MPIcommand = mpiexec -host @host@ -n @nprocs@ @command@
#MPIcommand = mpiexec -n @nprocs@ @command@ amrex.the_arena_init_size=1073741824 amrex.the_arena_is_managed=true
MPIcommand = mpiexec -n @nprocs@ @command@ amrex.the_arena_init_size=0 amrex.the_arena_is_managed=true
#MPIcommand = cuda-memcheck mpiexec -n @nprocs@ @command@
MPIhost = 

reportActiveTestsOnly = 1

# Add "GO UP" link at the top of the web page?
goUpLink = 1

# email
sendEmailWhenFail = 1
emailTo = asalmgren@lbl.gov, amlattanzi@lbl.gov
emailBody = Check https://ccse.lbl.gov/pub/GpuRegressionTesting/ERF/

[AMReX]
dir = /home/regtester/git/amrex
branch = development
#hash = cc850f3c226bf3601a5cdf64882ebcf9fc

[source]
dir = /home/regtester/git/ERF
branch = development
#hash = 574a41385cd9a98f85a76e082dbed879a759781

