dim = 3
restartTest = 0
useMPI = 1
numprocs = 4
compileTest = 0
doVis = 0
runtime_params = max_step=50 erf.fixed_mri_dt_ratio=4 erf.pbl_type=NATIVE_SHOC erf.shoc.transport_mode=state_update erf.shoc.momentum_transport=state_update erf.shoc.signed_tke_production=true erf.shoc.extra_shoc_diags=true erf.shoc.shoc_1p5tke=true erf.deterministic_ic_pert=1
