# Sets ID tokens for every job using `default:`
include:
  - project: 'lc-templates/id_tokens'
    file: 'id_tokens.yml'

default:
  interruptible: true

workflow:
  # Run this pipeline any time the parent pipeline triggers it. Need to run when
  # triggered by a merge request event.
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  # Auto-cancel redundant pipelines
  auto_cancel:
    on_new_commit: interruptible

stages:
  - is-machine-up
  - allocate-resources
  - jobs-stage-1
  - jobs-stage-2
  - jobs-stage-3
  - release-resources

##############################################################################
# UTILITIES

.on_tuolumne:
  tags:
    - shell
    - tuolumne
  variables:
    CI_LINK_JOBS: 4

    MPICH_GPU_SUPPORT_ENABLED: "1"
    MPICH_OFI_NIC_POLICY: GPU
    HSA_XNACK: "1"

    # On Tuolumne hipMalloc draws from the same HBM the CPU uses as system
    # RAM. The AMReX arena reserves 3/4 of the memory which may cause host
    # allocations to fail. Set an initial allocation size which grows on demand.
    AMREX_THE_ARENA_INIT_SIZE: "17179869184"   # 16 GiB

    # rocFFT starts every kernel compile for a plan at once, unbounded; all but
    # one go to rocfft_rtc_helper subprocesses and they draw on the same HBM as
    # the arena. Disable multi-process compilation.
    ROCFFT_RTC_PROCESS: "0"

    # Persist compiled kernels so only the first run on a node pays for them.
    ROCFFT_RTC_CACHE_PATH:
      value: "/tmp/rocfft_kernel_cache_$USER.db"
      expand: false

.job_on_tuolumne:
  extends: .on_tuolumne
  stage: jobs-stage-1
  variables:
    # Note: "flux" gets expanded to "flux run" inside build script
    MPIEXEC_EXECUTABLE: flux
    # Concurrent-safe binding: this job shares the node with sibling matrix
    # jobs, so a test launch cannot take the whole node and mpibind would infer
    # GPUs from whatever fragmented cores it got. Bind explicitly from the
    # granted resource set instead.
    MPIEXEC_PREFLAGS: "--gpus-per-task=1 --label-io -vv -o mpibind=off -o gpu-affinity=per-task -o cpu-affinity=per-task"
  script:
    # Allocation information
    - echo -e "### Allocation name is ${ALLOC_NAME}"
    - export JOBID=$(flux jobs -n --name=${ALLOC_NAME} --format="{id}")
    - if [[ -z "${JOBID}" ]]; then echo "No JOBID found for ${ALLOC_NAME}"; exit 1; fi
    - echo -e "### Job ID is ${JOBID}"
    # A small resource claim so sibling matrix jobs can run alongside, with both
    # binding plugins off so the build still sees every core.
    - flux proxy "${JOBID}" flux run -N 1 -n 1 -c 1 -vv -o pmi=off -o cpu-affinity=off -o mpibind=off ${TEST_SCRIPT}

.job_on_tuolumne_exclusive:
  extends: .on_tuolumne
  stage: jobs-stage-1
  variables:
    # Note: "flux" gets expanded to "flux run" inside build script
    MPIEXEC_EXECUTABLE: flux
    MPIEXEC_PREFLAGS: "-N 1 --exclusive --label-io --setopt=mpibind=verbose:1 -vv"
  script:
    # Allocation information
    - echo -e "### Allocation name is ${ALLOC_NAME}"
    - export JOBID=$(flux jobs -n --name=${ALLOC_NAME} --format="{id}")
    - if [[ -z "${JOBID}" ]]; then echo "No JOBID found for ${ALLOC_NAME}"; exit 1; fi
    - echo -e "### Job ID is ${JOBID}"
    # Run the script as the INITIAL PROGRAM of a whole-node subinstance, not as
    # a job inside the allocation. The initial program consumes no resources, so
    # (a) the build sees every core with no affinity flags, and (b) the ctest
    # launches below can take the whole node, which is what mpibind needs to map
    # one task per APU.
    - flux proxy "${JOBID}" flux alloc -N 1 --exclusive -o cpu-affinity=off -o mpibind=off ${TEST_SCRIPT}

##############################################################################
# JOBS

# Check if the machine is online
is_machine_up:
  stage: is-machine-up
  tags:
    - shell
    - oslic
  variables:
    GIT_STRATEGY: none
  script:
    - |
      if [[ $(jq '.[env.CI_MACHINE].total_nodes_up' /usr/global/tools/lorenz/data/loginnodeStatus) == 0 ]]
      then
        echo -e "\e[31mNo nodes available on ${CI_MACHINE}!\e[0m"
        exit 1
      else
        echo -e "\e[32m${CI_MACHINE} is up!\e[0m"
      fi

# Allocate resources for build and test
allocate_resources:
  variables:
    GIT_STRATEGY: none
    ALLOC_TIME: 180
  extends: .on_tuolumne
  stage: allocate-resources
  script:
    - echo -e "Allocating resources for ${ALLOC_NAME} on the ${ALLOC_QUEUE} queue for ${ALLOC_TIME} minutes"
    - flux alloc -N 1 -q ${ALLOC_QUEUE} --bank=${ALLOC_BANK} --time-limit=${ALLOC_TIME} --bg --exclusive --job-name=${ALLOC_NAME} --setattr=thp=always

# Deallocate resources for build and test
# Note: in the rules above this is always run
release_resources:
  variables:
    GIT_STRATEGY: none
  extends: .on_tuolumne
  stage: release-resources
  script:
    - echo -e "Deallocating resources for ${ALLOC_NAME}"
    - export JOBID=$(flux jobs -n --name=${ALLOC_NAME} --format="{id}")
    - ([[ -n "${JOBID}" ]] && flux cancel ${JOBID} || exit 0)
  when: always
  interruptible: false
