name: Windows

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-windows
  cancel-in-progress: true


jobs:
  WIN32-MSVC10:
    name: WIN32 MSVC@19.29 - Particles ${{matrix.particles}} - MPI ${{matrix.mpi}}
    runs-on: windows-latest
    strategy:
      matrix:
        particles: [OFF, ON]
        mpi: [OFF, ON]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install MS-MPI
      if: matrix.mpi == 'ON'
      run: |
        Invoke-WebRequest -Uri https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisetup.exe -OutFile msmpisetup.exe
        Start-Process -FilePath .\msmpisetup.exe -ArgumentList "-unattend" -Wait
        Invoke-WebRequest -Uri https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisdk.msi -OutFile msmpisdk.msi
        Start-Process -FilePath msiexec.exe -ArgumentList "/quiet /i msmpisdk.msi" -Wait

        echo "C:\Program Files\Microsoft MPI\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ${{runner.temp}}/deps
        key: ${{ runner.os }}-deps-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Configure Project and Generate Build System
      run: |

        cmake -S . -B build `
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install `
          -DCMAKE_BUILD_TYPE:STRING=Debug `
          -DERF_DIM:STRING=3 `
          -DERF_ENABLE_MPI:BOOL=${{matrix.mpi}} `
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} `
          ${{ matrix.mpi == 'ON' && '-DMPI_C_INCLUDE_PATH="C:/Program Files (x86)/Microsoft SDKs/MPI/Include" -DMPI_CXX_INCLUDE_PATH="C:/Program Files (x86)/Microsoft SDKs/MPI/Include" -DMPI_C_LIBRARIES="C:/Program Files (x86)/Microsoft SDKs/MPI/Lib/x64/msmpi.lib" -DMPI_CXX_LIBRARIES="C:/Program Files (x86)/Microsoft SDKs/MPI/Lib/x64/msmpi.lib"' || '' }} `
          -DERF_ENABLE_TESTS:BOOL=ON `
          -DERF_ENABLE_ALL_WARNINGS:BOOL=OFF `
          -DERF_ENABLE_FCOMPARE:BOOL=ON `
          ${{github.workspace}};


    - name: Compile and Link
      run: |
        cmake --build build --parallel 2 --verbose

    - name: CMake Tests # see file ERF/Tests/CTestList.cmake
      run: |
        ctest -L regression -VV
      working-directory: ${{runner.workspace}}/ERF/build
