name: Windows

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-windows
  cancel-in-progress: true


jobs:
  WIN32-MSVC10:
    name: WIN32 MSVC@19.29 - Particles ${{matrix.particles}} - MPI ${{matrix.mpi}}
    runs-on: windows-latest
    strategy:
      matrix:
        particles: [OFF, ON]
        mpi: [OFF, ON]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install MS-MPI
      if: matrix.mpi == 'ON'
      run: |
        Invoke-WebRequest -Uri https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisetup.exe -OutFile msmpisetup.exe
        Start-Process -FilePath .\msmpisetup.exe -ArgumentList "-unattend" -Wait
        Invoke-WebRequest -Uri https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisdk.msi -OutFile msmpisdk.msi
        Start-Process -FilePath msiexec.exe -ArgumentList "/quiet /i msmpisdk.msi" -Wait

        echo "C:\Program Files\Microsoft MPI\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ${{runner.temp}}/deps
        key: ${{ runner.os }}-deps-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Configure Project and Generate Build System
      run: |

        cmake -S . -B build `
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install `
          -DCMAKE_BUILD_TYPE:STRING=Debug `
          -DERF_DIM:STRING=3 `
          -DERF_ENABLE_MPI:BOOL=${{matrix.mpi}} `
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} `
          ${{ matrix.mpi == 'ON' && '-DMPI_C_INCLUDE_PATH="C:/Program Files (x86)/Microsoft SDKs/MPI/Include" -DMPI_CXX_INCLUDE_PATH="C:/Program Files (x86)/Microsoft SDKs/MPI/Include" -DMPI_C_LIBRARIES="C:/Program Files (x86)/Microsoft SDKs/MPI/Lib/x64/msmpi.lib" -DMPI_CXX_LIBRARIES="C:/Program Files (x86)/Microsoft SDKs/MPI/Lib/x64/msmpi.lib"' || '' }} `
          -DERF_ENABLE_TESTS:BOOL=ON `
          -DERF_ENABLE_ALL_WARNINGS:BOOL=OFF `
          -DMPIEXEC_EXECUTABLE:PATH="C:/Program Files/Microsoft MPI/Bin/mpiexec.exe" `
          -DERF_ENABLE_FCOMPARE:BOOL=ON `
          ${{github.workspace}};


    - name: Compile and Link
      run: |
        cmake --build build --parallel 2 --verbose

    - name: Prepare Windows Test Environment
      if: matrix.mpi == 'ON'
      shell: pwsh
      run: |
        # Create a custom test runner script
        @"
        @echo off
        setlocal enabledelayedexpansion

        rem Extract the command from arguments
        set cmd=%*

        rem Replace forward slashes with backslashes
        set cmd=!cmd:/=\!

        rem Execute the command
        !cmd!

        exit /b %ERRORLEVEL%
        "@ | Out-File -FilePath ${{runner.workspace}}/ERF/build/test_runner.bat -Encoding ascii

        # Create CMake script to override test settings
        @"
        # Override test properties to use CMD instead of sh.exe
        file(GLOB_RECURSE TEST_LIST "${CMAKE_BINARY_DIR}/Testing/Temporary/CTestCostData.txt" "${CMAKE_BINARY_DIR}/CTestTestfile.cmake")

        foreach(TEST_FILE ${TEST_LIST})
          file(STRINGS ${TEST_FILE} TEST_CONTENT)
          string(REGEX REPLACE "\"C:/Program Files/Git/bin/sh.exe\" \"-c\"" "cmd.exe /c \"${CMAKE_BINARY_DIR}/test_runner.bat\"" NEW_CONTENT "${TEST_CONTENT}")
          file(WRITE ${TEST_FILE} "${NEW_CONTENT}")
        endforeach()
        "@ | Out-File -FilePath ${{runner.workspace}}/ERF/build/fix_tests.cmake -Encoding ascii

        # Run the CMake script to modify the test configuration
        cd ${{runner.workspace}}/ERF/build
        cmake -P fix_tests.cmake

    - name: CMake Tests with MPI
      if: matrix.mpi == 'ON'
      shell: pwsh
      run: |
        $env:MPIEXEC = "C:\Program Files\Microsoft MPI\Bin\mpiexec.exe"
        $env:CTEST_OUTPUT_ON_FAILURE = 1

        # Manually run each test that's failing
        Write-Host "Running SuperCell_3D test..."
        Push-Location "D:/a/ERF/ERF/Build/Tests/test_files/SuperCell_3D/"
        & "$env:MPIEXEC" -n 2 "D:/a/ERF/ERF/Build/Exec/MoistRegTests/SuperCell_3D/erf_supercell.exe" "SuperCell_3D.i" | Out-File -FilePath "SuperCell_3D.log"
        if ($LASTEXITCODE -ne 0) { throw "Test execution failed" }

        & "$env:MPIEXEC" -n 1 "D:/a/ERF/ERF/Build/Submodules/AMReX/Tools/Plotfile/amrex_fcompare.exe" --abort_if_not_all_found -a -r 2.0e-10 --abs_tol 2.0e-10 "D:/a/ERF/ERF/Tests/ERFGoldFiles/SuperCell_3D" "plt00010"
        if ($LASTEXITCODE -ne 0) { throw "Comparison failed" }
        Pop-Location

        # Run other tests via CTest if they don't have the same issue
        ctest -L regression -E "SuperCell_3D" -VV
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Tests # see file ERF/Tests/CTestList.cmake
      if: matrix.mpi == 'OFF'
      run: |
        ctest -L regression -VV
      working-directory: ${{runner.workspace}}/ERF/build
