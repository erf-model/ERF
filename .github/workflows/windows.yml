name: Windows

on:
  push:
    branches: [development]
    paths:
      - '**'
      - '!Docs/**'
      - '!**.md'
      - '!**.rst'
      - '!license.txt'
      - '!.github/workflows/**'
      - '.github/workflows/windows.yml'
      - '.github/actions/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**'
      - '!Docs/**'
      - '!**.md'
      - '!**.rst'
      - '!license.txt'
      - '!.github/workflows/**'
      - '.github/workflows/windows.yml'
      - '.github/actions/**'
  workflow_dispatch:

# Development pushes finish the active run and keep only the newest pending commit.
# PR cancellation and commit-specific manual groups stay unchanged.
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || (github.event_name == 'push' && 'latest') || github.sha }}-windows
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  windows:
    name: Windows MSVC - MPI ${{ matrix.mpi }} - Mesh ${{ matrix.mesh_precision }} Particles ${{ matrix.particles }} ${{ matrix.particles_precision }}
    permissions:
      contents: read
      packages: write
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # PR tier: MPI off, DOUBLE. Merge to development builds everything (and writes the caches).
        mpi: ${{ fromJSON(github.event_name == 'pull_request' && '["OFF"]' || '["OFF", "ON"]') }}
        mesh_precision: ${{ fromJSON(github.event_name == 'pull_request' && '["DOUBLE"]' || '["DOUBLE", "SINGLE"]') }}
        particles: [OFF, ON]
        particles_precision: [DOUBLE, SINGLE]
        exclude:
          # Only matching mesh/particle precisions are tested, i.e. DOUBLE mesh
          # with DOUBLE particles and SINGLE mesh with SINGLE particles.
          - mesh_precision: DOUBLE
            particles_precision: SINGLE
          - mesh_precision: SINGLE
            particles_precision: DOUBLE
          # SINGLE precision is only exercised in the particle-enabled build.
          - mesh_precision: SINGLE
            particles: OFF
          # The MPI-off build is particles-on only; particles-off is covered by the MPI build.
          - mpi: OFF
            particles: OFF
    env:
      BUILD_TYPE: ${{ matrix.mpi == 'ON' && 'Release' || 'RelWithDebInfo' }}
      ASSERTIONS: ${{ matrix.mpi == 'ON' && 'OFF' || 'ON' }}

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false

    - name: Select cache configuration
      shell: bash
      env:
        TRUNK_KEY: windows-latest-${{ runner.arch }}-msvc-${{ matrix.mpi == 'ON' && 'msmpi' || 'mpi-off' }}-${{ matrix.mesh_precision }}-particles-${{ matrix.particles }}
      run: printf 'CCACHE_TRUNK_KEY=%s\n' "$TRUNK_KEY" >> "$GITHUB_ENV"

    - name: Install ccache
      shell: pwsh
      run: |
        Invoke-WebRequest https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip -OutFile ccache.zip
        Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
        "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64" | Out-File -FilePath $env:GITHUB_PATH -Append
        "CCACHE_DIR=$env:RUNNER_TEMP\ccache" | Out-File -FilePath $env:GITHUB_ENV -Append

    # GHCR trunk per configuration; the old Actions cache seeds the first restore.
    - name: Restore Cache
      id: ghcr-cache
      uses: ./.github/actions/ccache-trunk
      with:
        mode: restore
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ${{ runner.temp }}\ccache
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore legacy Actions cache
      if: steps.ghcr-cache.outputs.hit != 'true'
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}\ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-mpi-${{ matrix.mpi }}-${{ matrix.mesh_precision }}-${{ matrix.particles }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-mpi-${{ matrix.mpi }}-${{ matrix.mesh_precision }}-${{ matrix.particles }}-git-

    # SDK to build against, runtime so mpiexec exists and the tests can run under MPI.
    - name: Install MS-MPI
      if: matrix.mpi == 'ON'
      shell: pwsh
      run: |
        curl -L -o msmpisdk.msi https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisdk.msi
        curl -L -o msmpisetup.exe https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisetup.exe
        msiexec /i msmpisdk.msi /qn /norestart
        Start-Process -FilePath .\msmpisetup.exe -ArgumentList '-unattend','-force' -Wait
        "MSMPI_INC=C:\Program Files (x86)\Microsoft SDKs\MPI\Include" | Out-File -FilePath $env:GITHUB_ENV -Append
        "MSMPI_LIB=C:\Program Files (x86)\Microsoft SDKs\MPI\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
        "C:\Program Files\Microsoft MPI\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        & "C:\Program Files\Microsoft MPI\Bin\mpiexec.exe" -help | Select-Object -First 1

    - name: Set up the MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure Project and Generate Build System
      shell: pwsh
      run: |
        $mpi_args = @()
        if ("${{ matrix.mpi }}" -eq "ON") {
          $mpi_args = @(
            "-DMPI_CXX_LIB_NAMES=msmpi",
            "-DMPI_C_LIB_NAMES=msmpi",
            "-DMPI_msmpi_LIBRARY=$env:MSMPI_LIB\msmpi.lib",
            "-DMPI_CXX_INCLUDE_DIR=$env:MSMPI_INC",
            "-DMPI_C_INCLUDE_DIR=$env:MSMPI_INC",
            "-DMPIEXEC_EXECUTABLE=C:/Program Files/Microsoft MPI/Bin/mpiexec.exe",
            "-DERF_TEST_NRANKS:STRING=2"
          )
        }
        cmake -S . -B build -G Ninja `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install `
          -DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE `
          -DAMReX_ASSERTIONS:BOOL=$env:ASSERTIONS `
          -DERF_DIM:STRING=3 `
          -DERF_ENABLE_MPI:BOOL=${{ matrix.mpi }} `
          -DERF_ENABLE_PARTICLES:BOOL=${{ matrix.particles }} `
          -DERF_PRECISION:STRING=${{ matrix.mesh_precision }} `
          -DERF_PARTICLES_PRECISION:STRING=${{ matrix.particles_precision }} `
          -DERF_ENABLE_TESTS:BOOL=ON `
          -DERF_ENABLE_ALL_WARNINGS:BOOL=OFF `
          -DERF_ENABLE_FCOMPARE:BOOL=ON `
          @mpi_args `
          ${{github.workspace}}
        if ($LASTEXITCODE -ne 0) { throw "configure failed" }

    - name: Compile and Link
      shell: pwsh
      run: |
        $env:CCACHE_COMPRESS = "1"
        $env:CCACHE_COMPRESSLEVEL = "10"
        ccache -z
        $build_start = [int](Get-Date -UFormat %s)
        cmake --build build --parallel $env:NUMBER_OF_PROCESSORS
        if ($LASTEXITCODE -ne 0) { throw "build failed" }
        # Keep only what this build used; see ci.yml.
        $age = [int](Get-Date -UFormat %s) - $build_start + 120
        ccache --evict-older-than "${age}s"
        '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
        ccache -s | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
        '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

    - name: Save Cache
      if: always() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
      uses: ./.github/actions/ccache-trunk
      with:
        mode: save
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ${{ runner.temp }}\ccache
        token: ${{ secrets.GITHUB_TOKEN }}


    # Tests run on the DOUBLE builds with particles: once without MPI (the PR job) and
    # once under mpiexec with 2 ranks (merge tier).
    - name: Check Unit Test Registration
      if: matrix.mesh_precision == 'DOUBLE' && matrix.particles == 'ON'
      shell: pwsh
      run: |
        $out = & "${{runner.workspace}}/ERF/build/Tests/Unit/erf_unit_tests.exe" --gtest_list_tests
        $out
        $outText = $out -join "`n"
        if ($outText -notmatch '(?m)^[A-Za-z0-9_].*\.$') {
          throw "No unit tests registered"
        }
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Unit Tests
      if: matrix.mesh_precision == 'DOUBLE' && matrix.particles == 'ON'
      shell: pwsh
      run: |
        ctest -L unit -VV @("${{ matrix.mpi == 'ON' && '-j,2,--repeat,until-pass:2' || '-j,4' }}".Split(','))
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Shuffle Stress Test
      if: matrix.mesh_precision == 'DOUBLE' && matrix.particles == 'ON'
      shell: pwsh
      run: ctest -L stress --output-on-failure --no-tests=error @("${{ matrix.mpi == 'ON' && '-j,2,--repeat,until-pass:2' || '-j,4' }}".Split(','))
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Regression Tests # see file ERF/Tests/CTestList.cmake
      if: matrix.mesh_precision == 'DOUBLE' && matrix.particles == 'ON'
      shell: pwsh
      run: |
        ctest -L regression -VV @("${{ matrix.mpi == 'ON' && '-j,2,--repeat,until-pass:2' || '-j,4' }}".Split(','))
      working-directory: ${{runner.workspace}}/ERF/build

    # The MS-MPI builds are the downloadable binaries: the executable and how to run it,
    # not the build tree (which was 450-512 MB per variant).
    - name: Create Installation README
      if: matrix.mpi == 'ON'
      shell: pwsh
      run: |
        @"
        # ERF Windows Build - Installation Instructions

        ## Build Information
        - Build Type: $env:BUILD_TYPE
        - MPI Enabled: ${{ matrix.mpi }}
        - Particles Enabled: ${{ matrix.particles }}
        - Mesh precision: ${{ matrix.mesh_precision }}
        - MS-MPI Version: 10.1.1
        - Built on: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
        - Commit: ${{ github.sha }}

        ## Required Runtime Installation

        This executable requires MS-MPI Runtime v10.1.1 to run.

        ### Quick Install (PowerShell):
        ``````powershell
        # Download and install MS-MPI Runtime v10.1.1
        Invoke-WebRequest -Uri "https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisetup.exe" -OutFile "msmpisetup.exe"
        .\msmpisetup.exe

        # After installation, open a NEW PowerShell window to refresh PATH
        ``````

        ### Alternative Install (using vcpkg):
        ``````powershell
        # vcpkg will download the installer and prompt you to run it
        vcpkg install msmpi:x64-windows
        # Follow the instructions vcpkg provides to run the downloaded installer
        ``````

        ## Running the Executable

        ``````powershell
        # Single process
        mpiexec -n 1 .\erf_exec.exe path\to\inputs_file

        # Multiple processes (e.g., 4)
        mpiexec -n 4 .\erf_exec.exe path\to\inputs_file
        ``````

        **Important:** Always use `mpiexec` to launch. Running `.\erf_exec.exe` directly will trigger Windows Defender firewall warnings.

        ## Troubleshooting

        ### Executable runs but produces no output:
        - MS-MPI runtime is not installed, or the wrong version is installed.
        - Install MS-MPI v10.1.1 runtime using the script above
        - Open a NEW terminal after installation

        ### "mpiexec not recognized":
        - Open a new PowerShell window after installing MS-MPI
        - Or manually refresh PATH: `$env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine")`
        "@ | Out-File -FilePath build\INSTALL.txt -Encoding utf8

    - name: Upload the executable
      if: matrix.mpi == 'ON'
      uses: actions/upload-artifact@v7
      with:
        name: ERF-win64-${{ env.BUILD_TYPE }}-mpi-${{ matrix.mpi }}-mesh-${{ matrix.mesh_precision }}-particles-${{ matrix.particles }}-${{ matrix.particles_precision }}
        path: |
          build/Exec/erf_exec.exe
          build/INSTALL.txt
        if-no-files-found: error
        retention-days: 14
