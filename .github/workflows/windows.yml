name: Windows

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || github.sha }}-windows
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  WIN32-MSVC10:
    name: WIN32 MSVC@19.29 - Mesh ${{matrix.mesh_precision}} Particles ${{matrix.particles}} ${{matrix.particles_precision}}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Only the particle-enabled configuration is built here; the
        # particles-OFF variant duplicates its solver coverage. Particles OFF
        # is still built by ci, gcc and windows-mpi.
        particles: [ON]
        particles_precision: [DOUBLE, SINGLE]
        # PR tier: DOUBLE only. SINGLE builds on merge to development (which also writes its ccache).
        mesh_precision: ${{ fromJSON(github.event_name == 'pull_request' && '["DOUBLE"]' || '["DOUBLE", "SINGLE"]') }}
        exclude:
          # Only matching mesh/particle precisions are tested, i.e. DOUBLE mesh
          # with DOUBLE particles and SINGLE mesh with SINGLE particles.
          - mesh_precision: DOUBLE
            particles_precision: SINGLE
          - mesh_precision: SINGLE
            particles_precision: DOUBLE

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true

    # ccache for MSVC. Three things make it work where earlier attempts did not:
    # the Ninja generator (CMake only honours COMPILER_LAUNCHER for Makefile and
    # Ninja generators, never for MSBuild), debug info embedded in each object
    # (/Z7 via CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded; the default /Zi
    # writes a shared .pdb that ccache cannot key on), and no /MP (ccache
    # handles one source per compiler call; Ninja provides the parallelism).
    - name: Install ccache
      shell: pwsh
      run: |
        Invoke-WebRequest https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip -OutFile ccache.zip
        Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
        "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64" | Out-File -FilePath $env:GITHUB_PATH -Append
        "CCACHE_DIR=$env:RUNNER_TEMP\ccache" | Out-File -FilePath $env:GITHUB_ENV -Append

    # ccache per matrix variant, written only from development; see ci.yml for how it works.
    - name: Restore Cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}\ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-

    - name: Set up the MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure Project and Generate Build System
      shell: pwsh
      run: |
        cmake -S . -B build -G Ninja `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install `
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo `
          -DAMReX_ASSERTIONS:BOOL=ON `
          -DERF_DIM:STRING=3 `
          -DERF_ENABLE_MPI:BOOL=OFF `
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} `
          -DERF_PRECISION:STRING=${{matrix.mesh_precision}} `
          -DERF_PARTICLES_PRECISION:STRING=${{matrix.particles_precision}} `
          -DERF_ENABLE_TESTS:BOOL=ON `
          -DERF_ENABLE_ALL_WARNINGS:BOOL=OFF `
          -DERF_ENABLE_FCOMPARE:BOOL=ON `
          ${{github.workspace}};

    - name: Compile and Link
      shell: pwsh
      run: |
        $env:CCACHE_COMPRESS = "1"
        $env:CCACHE_COMPRESSLEVEL = "10"
        $env:CCACHE_MAXSIZE = "600M"
        ccache -z
        $build_start = [int](Get-Date -UFormat %s)
        cmake --build build --parallel $env:NUMBER_OF_PROCESSORS
        if ($LASTEXITCODE -ne 0) { throw "build failed" }
        # Keep only what this build used; see ci.yml.
        $age = [int](Get-Date -UFormat %s) - $build_start + 120
        ccache --evict-older-than "${age}s"
        '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
        ccache -s | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
        '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

    - name: Save Cache
      if: always() && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}\ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-${{ github.sha }}

    - name: Check Unit Test Registration
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      shell: pwsh
      run: |
        $out = & "${{runner.workspace}}/ERF/build/Tests/Unit/erf_unit_tests.exe" --gtest_list_tests
        $out
        $outText = $out -join "`n"
        if ($outText -notmatch '(?m)^[A-Za-z0-9_].*\.$') {
          throw "No unit tests registered"
        }
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Unit Tests
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L unit -VV -j $env:NUMBER_OF_PROCESSORS
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Shuffle Stress Test
      if: matrix.particles == 'ON' && matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      shell: pwsh
      run: ctest -L stress --output-on-failure --no-tests=error -j $env:NUMBER_OF_PROCESSORS
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Regression Tests # see file ERF/Tests/CTestList.cmake
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L regression -VV -j $env:NUMBER_OF_PROCESSORS
      working-directory: ${{runner.workspace}}/ERF/build
