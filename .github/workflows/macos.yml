name: MacOS

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || github.sha }}-macos
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  MacOS-Clang:
    name: Apple Clang@11.0 - Mesh ${{matrix.mesh_precision}} Particles ${{matrix.particles}} ${{matrix.particles_precision}}
    runs-on: macos-latest
    timeout-minutes: 120
    # env: {CXXFLAGS: "-fno-operator-names -Werror -Wall -Wextra -Wpedantic -Wnull-dereference -Wfloat-conversion -Wshadow -Woverloaded-virtual"}
    strategy:
      fail-fast: false
      matrix:
        # Only the particle-enabled configuration is built here; the
        # particles-OFF variant duplicates its solver coverage. Particles OFF
        # is still built by ci, gcc and windows-mpi.
        particles: [ON]
        particles_precision: [DOUBLE, SINGLE]
        # PR tier: DOUBLE only. SINGLE builds on merge to development (which also writes its ccache).
        mesh_precision: ${{ fromJSON(github.event_name == 'pull_request' && '["DOUBLE"]' || '["DOUBLE", "SINGLE"]') }}
        exclude:
          # Only matching mesh/particle precisions are tested, i.e. DOUBLE mesh
          # with DOUBLE particles and SINGLE mesh with SINGLE particles.
          - mesh_precision: DOUBLE
            particles_precision: SINGLE
          - mesh_precision: SINGLE
            particles_precision: DOUBLE

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Dependencies
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_mac.sh

    # ccache per matrix variant, written only from development; see ci.yml for how it works.
    - name: Restore Cache
      uses: actions/cache/restore@v6
      with:
        path: ~/Library/Caches/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-

    - name: Configure Project and Generate Build System
      run: |
        cmake \
          -B${{runner.workspace}}/ERF/build \
          -DBUILD_SHARED_LIBS:BOOL=FALSE \
          -DCMAKE_CXX_COMPILER_LAUNCHER=$(which ccache) \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DAMReX_ASSERTIONS:BOOL=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=TRUE \
          -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \
          '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4' \
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} \
          -DERF_PRECISION:STRING=${{matrix.mesh_precision}} \
          -DERF_PARTICLES_PRECISION:STRING=${{matrix.particles_precision}} \
          -DERF_ENABLE_TESTS:BOOL=TRUE \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=TRUE \
          -DERF_ENABLE_FCOMPARE:BOOL=TRUE \
          ${{github.workspace}};

    - name: Compile and Link
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=350M
        export CCACHE_SLOPPINESS=time_macros
        ccache -z

        cmake --build ${{runner.workspace}}/ERF/build --parallel 2 --verbose \
        2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        du -hs ~/Library/Caches/ccache
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Save Cache
      if: always() && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: ~/Library/Caches/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-${{ github.sha }}

    - name: Report
      run: |
        grep -Ei "warning:|error:" ${{runner.workspace}}/build-output.txt \
          | grep -Ev "Submodules/(amrex|googletest)" | grep -Ev "lto-wrapper: warning:" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        exit ${return}

    - name: Check Unit Test Registration
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        Tests/Unit/erf_unit_tests --gtest_list_tests | tee ${{runner.workspace}}/unit-test-list.txt
        grep -Eq '^[A-Za-z0-9_].*\.$' ${{runner.workspace}}/unit-test-list.txt
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Run Serial Unit Tests
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L unit --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Run Parallel Tests
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L parallel --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Regression Tests # see file ERF/Tests/CTestList.cmake
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L regression -VV
      working-directory: ${{runner.workspace}}/ERF/build

    # A test that dies on a signal (for example SIGILL from amrex.fpe_trap_invalid)
    # writes Backtrace.<rank> into its run directory; the log only says "See
    # Backtrace.0 file for details", so keep those files when a step has failed.
    - name: Upload backtraces from failed tests
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: backtraces-macos-mesh-${{matrix.mesh_precision}}-particles-${{matrix.particles}}-${{matrix.particles_precision}}
        path: ${{runner.workspace}}/ERF/build/Tests/**/Backtrace.*
        if-no-files-found: ignore
        retention-days: 14
