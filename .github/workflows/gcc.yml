name: Linux GCC

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || github.sha }}-linux-gcc
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  library:
    name: GNU@9.3 C++17 - Mesh ${{matrix.mesh_precision}} Particles ${{matrix.particles}} ${{matrix.particles_precision}}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # env: {CXXFLAGS: "-fno-operator-names -Werror -Wall -Wextra -Wpedantic -Wnull-dereference -Wfloat-conversion -Wshadow -Woverloaded-virtual"}
    strategy:
      fail-fast: false
      matrix:
        particles: [OFF, ON]
        particles_precision: [DOUBLE, SINGLE]
        mesh_precision: [DOUBLE, SINGLE]
        exclude:
          # Only matching mesh/particle precisions are tested, i.e. DOUBLE mesh
          # with DOUBLE particles and SINGLE mesh with SINGLE particles.
          - mesh_precision: DOUBLE
            particles_precision: SINGLE
          - mesh_precision: SINGLE
            particles_precision: DOUBLE
          # SINGLE precision is only exercised in the particle-enabled build.
          - mesh_precision: SINGLE
            particles: OFF

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Dependencies
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies.sh

    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    # ccache per matrix variant, written only from development; see ci.yml for how it works.
    - name: Restore Cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-${{ matrix.particles }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-${{ matrix.particles }}-git-

    - name: Configure Project and Generate Build System
      run: |
        cmake \
          -B${{runner.workspace}}/ERF/build \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DAMReX_ASSERTIONS:BOOL=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \
          '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4' \
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} \
          -DERF_PRECISION:STRING=${{matrix.mesh_precision}} \
          -DERF_PARTICLES_PRECISION:STRING=${{matrix.particles_precision}} \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          -DERF_TEST_SDM_SMOKE_GATED:BOOL=ON \
          ${{github.workspace}};

    - name: Compile and Link
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z

        cmake --build ${{runner.workspace}}/ERF/build --parallel 2 --verbose \
        2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        echo '```' >> "$GITHUB_STEP_SUMMARY"
        ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        du -hs ~/.cache/ccache

    - name: Save Cache
      if: always() && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-${{ matrix.particles }}-git-${{ github.sha }}

    - name: Report
      run: |
        grep -Ei "warning:|error:" ${{runner.workspace}}/build-output.txt \
          | grep -Ev "Submodules/(amrex|googletest)" | grep -Ev "lto-wrapper: warning:" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        exit ${return}

    - name: GNUmake Compile and Link
      # Merge tier only: a second, uncached full compile that checks the Makefile build, not the code.
      if: github.event_name != 'pull_request' && matrix.particles == 'OFF' && matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        make -C Exec -j2 USE_NETCDF=FALSE USE_PARTICLES=FALSE

    - name: Check Unit Test Registration
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        Tests/Unit/erf_unit_tests --gtest_list_tests | tee ${{runner.workspace}}/unit-test-list.txt
        grep -Eq '^[A-Za-z0-9_].*\.$' ${{runner.workspace}}/unit-test-list.txt
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Run Serial Unit Tests
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L unit --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Run SBM Integration Tests
      if: matrix.particles == 'OFF' && matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L sbm --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Run Auxiliary Integration Tests
      if: matrix.particles == 'OFF' && matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L auxiliary --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    # Keep the existing DOUBLE unit/regression coverage and add focused SINGLE
    # SHOC and SBM remapping runtime checks without repeating the full unit
    # suite in the SINGLE build.
    - name: Run SINGLE SHOC Tests
      if: matrix.mesh_precision == 'SINGLE' && matrix.particles == 'ON' && matrix.particles_precision == 'SINGLE'
      run: |
        ctest -L shoc --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Run SINGLE SBM Contract Tests
      if: matrix.mesh_precision == 'SINGLE' && matrix.particles == 'ON' && matrix.particles_precision == 'SINGLE'
      run: |
        ctest -R '^(SBMRemapping|SBMFoundation)\.' \
              --output-on-failure \
              --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Run Parallel Tests
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L parallel --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: CMake Regression Tests # see file ERF/Tests/CTestList.cmake
      if: matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L regression -VV
      working-directory: ${{runner.workspace}}/ERF/build

    # The SDM cases whose gold files live in the machine-specific repository are
    # run to completion here instead. This build enables assertions, so an out of
    # bounds access or a failed invariant is caught even without a gold file.
    - name: SDM Smoke Tests
      # The smoke cases are only registered when particles are built in, so this
      # step has nothing to run (and --no-tests=error would fail) without them.
      if: matrix.particles == 'ON' && matrix.particles_precision == 'DOUBLE' && matrix.mesh_precision == 'DOUBLE'
      run: |
        ctest -L smoke --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    # A test that dies on a signal (for example SIGILL from amrex.fpe_trap_invalid)
    # writes Backtrace.<rank> into its run directory; the log only says "See
    # Backtrace.0 file for details", so keep those files when a step has failed.
    - name: Upload backtraces from failed tests
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: backtraces-gcc-mesh-${{matrix.mesh_precision}}-particles-${{matrix.particles}}-${{matrix.particles_precision}}
        path: ${{runner.workspace}}/ERF/build/Tests/**/Backtrace.*
        if-no-files-found: ignore
        retention-days: 14

  # Single stable required status check. Branch protection previously pinned the
  # individual matrix job names ("GNU@9.3 C++17 Release - Particles OFF"), which silently
  # stopped matching when the matrix gained its Mesh/precision axes -- leaving every PR
  # waiting forever on a context that could never report. Requiring only this job means
  # the matrix can be reshaped without touching branch protection again.
  ci-required:
    name: ci-required
    if: always()
    needs: [library]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check build matrix result
        run: |
          result="${{ needs.library.result }}"
          echo "Linux GCC matrix result: ${result}"
          # 'skipped' is legitimate (path filters); anything other than that or
          # 'success' means the matrix did not pass.
          [[ "${result}" == "success" || "${result}" == "skipped" ]] || exit 1
