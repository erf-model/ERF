name: DocHTML -- Build and Deploy

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-docs
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencies
        run: |
          .github/workflows/dependencies/documentation.sh
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Docs/sphinx_doc/requirements.txt

      - name: Build Docs
        run: |
          ./Docs/BuildDocs.sh

#     - name: Check links
#       run: |
#         cd Docs/sphinx_doc
#         make SPHINXOPTS="-v -W --keep-going" NO_DOXYGEN=TRUE linkcheck

      - name: Deploy to Webpage
        if: github.event_name == 'push' && github.repository == 'erf-model/ERF' && github.ref == 'refs/heads/development'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          repository-name: erf-model/docs
          branch: main # The branch the action should deploy to.
          folder: Docs/doxygen_output/html # The folder the action should deploy.
          commit-message: "Deployed from erf-model/ERF"
