name: PRSync

on:
  pull_request:
    types:
      - synchronize

# This mirrors PostPR, and exists for the same reason: a pull_request event
# from a fork gets a read-only GITHUB_TOKEN whatever the permissions block
# says, so this workflow cannot cancel anything itself. Its only purpose is
# to be a workflow_run trigger for CancelStaleCI, which then runs in
# base-repo context where actions: write is actually granted.

jobs:
  noop:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: No OP
        run: echo "This workflow is going to trigger CancelStaleCI."
