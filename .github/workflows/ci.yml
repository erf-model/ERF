name: ERF CI

on:
  push:
    # branches: [development]
    paths-ignore:
      - Docs
      - README.rst
      - license.txt

  pull_request:
    branches: [development]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-ci
  cancel-in-progress: true

jobs:

  Build-And-Test:
    runs-on: ${{matrix.os}}
    name: OS ${{matrix.os}} - Particles ${{matrix.particles}}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        particles: [OFF, ON]
        include:
        - os: ubuntu-22.04
          install_deps: sudo apt-get install mpich libmpich-dev
          comp: gnu
          procs: $(nproc)

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Free disk space on Ubuntu
      uses: ./.github/actions/free-space-ubuntu

    - name: Setup
      run: |
        # echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "NPROCS=${{matrix.procs}}" >> $GITHUB_ENV
        # cmake -E make_directory ${{runner.workspace}}/deps

    - name: Handle Dependencies
      run: |
        # Install MPI
        ${{matrix.install_deps}}

    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Configure CMake
      run: |
        cmake \
          -B${{runner.workspace}}/ERF/build-${{matrix.os}} \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install \
          -DCMAKE_BUILD_TYPE:STRING=Debug \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \
          '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4' \
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          ${{github.workspace}};
        # ${{matrix.mpipreflags}} \
        # -DCODECOVERAGE:BOOL=ON \

    - name: Build
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z

        cmake \
          --build ${{runner.workspace}}/ERF/build-${{matrix.os}} \
          --parallel ${{env.NPROCS}} \
          2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        ccache -s
        du -hs ~/.cache/ccache

    - name: Report
      run: |
        grep -Ei "warning:|error:" ${{runner.workspace}}/build-output.txt \
          | grep -Ev "Submodules/(amrex|googletest)" | grep -Ev "lto-wrapper: warning:" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        exit ${return}

    - name: Check Unit Test Registration
      run: |
        Tests/Unit/erf_unit_tests --gtest_list_tests | tee ${{runner.workspace}}/unit-test-list.txt
        grep -Eq '^[A-Za-z0-9_].*\.$' ${{runner.workspace}}/unit-test-list.txt
      working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}

    - name: Check Parallel Test Registration
      run: |
        ctest -N -V -L parallel | tee parallel-registration.txt
        if grep -Eq 'Could not find executable|Unable to find executable' parallel-registration.txt; then
          echo 'Parallel CTest registration contains a missing executable.' >&2
          exit 1
        fi
        if grep -Eq '^.*Test command: (COMMAND|/usr/bin/command)([[:space:]]|$)' parallel-registration.txt; then
          echo 'Parallel CTest registration treated COMMAND as the executable.' >&2
          exit 1
        fi
        test "$(grep -c '^.*Test command: ' parallel-registration.txt)" -eq 39
        test "$(grep -c '^  Test .*\.np1$' parallel-registration.txt)" -eq 13
        test "$(grep -c '^  Test .*\.np2$' parallel-registration.txt)" -eq 13
        test "$(grep -c '^  Test .*\.np4$' parallel-registration.txt)" -eq 13
        test "$(grep -c '^.*Labels: parallel$' parallel-registration.txt)" -eq 39
        if grep -Eq '^.*Labels: .*unit.*parallel|^.*Labels: .*parallel.*unit' parallel-registration.txt; then
          echo 'Parallel CTest entries must not carry the unit label.' >&2
          exit 1
        fi
      working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}

    - name: Run Serial Unit Tests
      run: |
        ctest -L unit -LE parallel --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}

    - name: Run Parallel Tests
      run: |
        ctest -L parallel --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}

    - name: Run Infrastructure Tests
      run: |
        ctest -L infrastructure --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}

    - name: Run Shuffle Stress Check
      if: matrix.particles == 'OFF'
      run: |
        ctest -L stress --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}

    - name: Regression Tests
      run: |
        ctest -L regression -VV --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}

    - name: Verify test reports
      if: success()
      shell: bash
      run: |
        report_root="${{runner.workspace}}/ERF/build-${{matrix.os}}/test-results"
        test -n "$(find "${report_root}" -type f -name '*.xml' -print -quit)"

    - name: Upload test reports and CTest logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: erf-test-results-${{matrix.os}}-particles-${{matrix.particles}}
        if-no-files-found: warn
        path: |
          ${{runner.workspace}}/ERF/build-${{matrix.os}}/test-results/**
          ${{runner.workspace}}/ERF/build-${{matrix.os}}/Testing/Temporary/LastTest.log
          ${{runner.workspace}}/ERF/build-${{matrix.os}}/Testing/Temporary/LastTestsFailed.log

    # Raf: disabled Codecov since the dashboard and GitHub comments were buggy,
    # but it may be useful to post the gcov coverage reports to GitHub Actions
    # artifacts.
