name: PostPR
on:
  pull_request:
    types:
      - closed

# This workflow does not have the permission to cancel the leftover CI runs
# of a PR originated from a fork: the GITHUB_TOKEN for a pull_request event
# from a fork is read-only whatever the permissions block says. The purpose
# here is to trigger the workflow_run workflow that does have the right
# permission, cancel-stale-ci.yml, to cancel whatever the PR left running.

jobs:
  noop:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: No OP
        run: echo "This workflow is going to trigger CancelStaleCI."
