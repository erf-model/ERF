name: ERF CI (cuda)

on:
  push:
    branches: [development]
    paths-ignore:
      - Docs/**
      - README.rst
      - license.txt

  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || github.sha }}-cuda-ci
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  cuda-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    name: CUDA v${{matrix.cuda_ver}} - Mesh ${{matrix.mesh_precision}} Particles ${{matrix.particles}} ${{matrix.particles_precision}}
    strategy:
      fail-fast: false
      matrix:
        cuda_pkg: [12-2]
        # GPU builds cover the particle-enabled configuration only. The
        # particles-OFF variant costs a second long GPU compile for solver
        # coverage the particles-ON build already provides; it is still built
        # on CPU by ci, gcc and windows-mpi.
        particles: [ON]
        particles_precision: [DOUBLE, SINGLE]
        # PR tier: DOUBLE only. SINGLE builds on merge to development (which also writes its ccache).
        mesh_precision: ${{ fromJSON(github.event_name == 'pull_request' && '["DOUBLE"]' || '["DOUBLE", "SINGLE"]') }}
        exclude:
          # Only matching mesh/particle precisions are tested, i.e. DOUBLE mesh
          # with DOUBLE particles and SINGLE mesh with SINGLE particles.
          - mesh_precision: DOUBLE
            particles_precision: SINGLE
          - mesh_precision: SINGLE
            particles_precision: DOUBLE
        include:
          - cuda_ver: "12.2"
            cuda_pkg: 12-2
            cuda_arch: "8.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Free up disk space
        uses: ./.github/actions/free-space-ubuntu
      - name: Prepare CUDA environment
        run: Submodules/AMReX/.github/workflows/dependencies/dependencies_nvcc.sh ${{matrix.cuda_ver}}
      - name: Install CCache
        run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh
      # ccache per matrix variant, written only from development; see ci.yml for how it works.
      - name: Restore Cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-${{ github.sha }}
          restore-keys: |
               ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-
      - name: Show disk space
        run: df -h
      - name: Configure and build
        shell: bash
        run: |
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=10
          export CCACHE_MAXSIZE=1100M
          ccache -z

          export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
          export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
          which nvcc || echo "nvcc not in PATH!"
          cmake -Bbuild-${{matrix.cuda_pkg}} \
            -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DAMReX_CUDA_ERROR_CROSS_EXECUTION_SPACE_CALL=ON \
            -DAMReX_CUDA_ERROR_CAPTURE_THIS=ON \
            -DAMReX_CUDA_ARCH=${{matrix.cuda_arch}} \
            -DERF_DIM:STRING=3 \
            -DERF_ENABLE_MPI:BOOL=ON \
            -DERF_ENABLE_CUDA:BOOL=ON \
            -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} \
            -DERF_PRECISION:STRING=${{matrix.mesh_precision}} \
            -DERF_PARTICLES_PRECISION:STRING=${{matrix.particles_precision}} \
            -DERF_TEST_NRANKS:STRING=2 \
            -DERF_ENABLE_UNIT_TESTS:BOOL=ON .
          echo "Building with $(nproc) processes"
          cmake --build build-${{matrix.cuda_pkg}} --parallel $(nproc) \
          2>&1 | tee -a ${{runner.workspace}}/build-${{matrix.cuda_pkg}}-output.txt;

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -hs ~/.cache/ccache

      - name: Save Cache
        if: always() && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-${{ github.sha }}

      - name: Report
        if: always()
        shell: bash
        run: |
          build_log="${{runner.workspace}}/build-${{matrix.cuda_pkg}}-output.txt"
          diagnostics="${{runner.workspace}}/build-${{matrix.cuda_pkg}}-diagnostics.txt"
          grep -Ei "warning:|warning #|error:|error #" "$build_log" \
            | grep -Ev "Submodules/(amrex|googletest)" \
            | grep -Ev "lto-wrapper: warning:" \
            | sort -fu > "$diagnostics" || true
          cat "$diagnostics"
          warning_count=$(grep -Eic "warning:|warning #" "$diagnostics" || true)
          error_count=$(grep -Eic "error:|error #" "$diagnostics" || true)
          echo "Warnings: ${warning_count:-0}"
          echo "Errors: ${error_count:-0}"
          if [ "${warning_count:-0}" -ne 0 ] || [ "${error_count:-0}" -ne 0 ]; then
            exit 1
          fi
