name: Style

on:
  # Fork feature pushes provide pre-PR CI; development sync pushes are skipped.
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-style
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  tabs:
    name: >-
      ${{ github.event_name == 'push' && !github.event.repository.fork &&
          github.ref != 'refs/heads/development' && 'tabs [skipped push]' ||
          'tabs' }}
    if: >-
      (github.event_name == 'pull_request' && !github.event.repository.fork) ||
      (github.event_name == 'push' &&
       ((!github.event.repository.fork &&
         github.ref == 'refs/heads/development') ||
        (github.event.repository.fork &&
         github.ref != 'refs/heads/development')))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Tabs
        run: .github/workflows/style/check_tabs.sh

  trailing_whitespaces:
    name: >-
      ${{ github.event_name == 'push' && !github.event.repository.fork &&
          github.ref != 'refs/heads/development' && 'trailing_whitespaces [skipped push]' ||
          'trailing_whitespaces' }}
    if: >-
      (github.event_name == 'pull_request' && !github.event.repository.fork) ||
      (github.event_name == 'push' &&
       ((!github.event.repository.fork &&
         github.ref == 'refs/heads/development') ||
        (github.event.repository.fork &&
         github.ref != 'refs/heads/development')))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trailing Whitespaces
        run: .github/workflows/style/check_trailing_whitespaces.sh
