name: Style

on:
  # Fork pushes provide pre-PR CI; jobs below skip canonical feature-branch pushes.
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-style
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  tabs:
    if: >-
      github.event_name != 'push' || github.repository != 'erf-model/ERF' ||
      github.ref == 'refs/heads/development'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Tabs
        run: .github/workflows/style/check_tabs.sh

  trailing_whitespaces:
    if: >-
      github.event_name != 'push' || github.repository != 'erf-model/ERF' ||
      github.ref == 'refs/heads/development'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trailing Whitespaces
        run: .github/workflows/style/check_trailing_whitespaces.sh
