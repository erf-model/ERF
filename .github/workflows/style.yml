name: Style

on:
  # Fork feature pushes provide pre-PR CI; all fork development pushes are intentionally skipped.
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-style
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  tabs:
    # GitHub currently leaves skipped-job names raw; this fallback stays distinct if evaluated.
    name: >-
      ${{ ((github.event_name == 'pull_request' && !github.event.repository.fork) ||
           (github.event_name == 'push' &&
            github.event.repository.fork == (github.ref != 'refs/heads/development')))
          && 'tabs' || 'tabs [policy skipped]' }}
    if: >-
      (github.event_name == 'pull_request' && !github.event.repository.fork) ||
      (github.event_name == 'push' &&
       github.event.repository.fork == (github.ref != 'refs/heads/development'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Tabs
        run: .github/workflows/style/check_tabs.sh

  trailing_whitespaces:
    # GitHub currently leaves skipped-job names raw; this fallback stays distinct if evaluated.
    name: >-
      ${{ ((github.event_name == 'pull_request' && !github.event.repository.fork) ||
           (github.event_name == 'push' &&
            github.event.repository.fork == (github.ref != 'refs/heads/development')))
          && 'trailing_whitespaces' || 'trailing_whitespaces [policy skipped]' }}
    if: >-
      (github.event_name == 'pull_request' && !github.event.repository.fork) ||
      (github.event_name == 'push' &&
       github.event.repository.fork == (github.ref != 'refs/heads/development'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trailing Whitespaces
        run: .github/workflows/style/check_trailing_whitespaces.sh
