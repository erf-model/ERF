name: Style

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-style
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  tabs:
    # The closed event exists only to cancel in-progress runs via concurrency.
    if: github.event.action != 'closed'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Tabs
        run: .github/workflows/style/check_tabs.sh

  trailing_whitespaces:
    # The closed event exists only to cancel in-progress runs via concurrency.
    if: github.event.action != 'closed'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trailing Whitespaces
        run: .github/workflows/style/check_trailing_whitespaces.sh
