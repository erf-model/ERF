name: CleanUpCache

on:
  workflow_run:
    workflows:
      - ERF CI
      - Linux GCC
      - Linux GCC NetCDF RRTMGP
      - ERF CI (cuda)
      - ERF CI (hip)
      - ERF CI (sycl)
      - MacOS
      - Windows
    types:
      - completed
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Keyed on branch only, not branch+sha, so back-to-back pushes coalesce instead of racing.
concurrency:
  group: cleanup-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  CleanUpCcacheCache:
    name: Clean Up Ccache Cache
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Clean up ccache
        run: |
          REPO=${{ github.repository }}

          # push or pull_request or schedule or ...
          EVENT="${{ github.event.workflow_run.event }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"

          # For debugging, cat ${GITHUB_EVENT_PATH} to see the payload.

          if [[ $EVENT == "pull_request" ]]; then
            pr_head_sha=${{ github.event.workflow_run.head_sha }}
            pr_number=$(gh pr list --search $pr_head_sha --json number --jq '.[0].number')
            echo "Clean up cache for PR ${pr_number}"
            BRANCH=refs/pull/${pr_number}/merge
          elif [[ -n $HEAD_BRANCH ]]; then
            BRANCH=refs/heads/${HEAD_BRANCH}
          else
            # schedule / workflow_dispatch: no workflow_run context to inherit
            BRANCH=refs/heads/development
          fi

          # Setting this to not fail the workflow while deleting cache keys.
          set +e

          keyprefix="ccache-"

          cached_jobs=$(gh cache list -R "$REPO" --ref "$BRANCH" --key "$keyprefix" --limit 100 --json key --jq '.[].key' | awk -F '-git-' '{print $1}' | sort | uniq)

          IFS=$'\n'
          for j in $cached_jobs
          do
            # Last used isn't always last created (ie we don't want latest cache overwritten by an old PR's cache)
            old_keys=$(gh cache list -R "$REPO" --ref "$BRANCH" --key "${j}-git-" --limit 100 --sort created_at --order desc --json key --jq '.[].key' | tail -n +2)
            for k in $old_keys
            do
              gh cache delete "$k" -R "$REPO"
            done
          done
          unset IFS
