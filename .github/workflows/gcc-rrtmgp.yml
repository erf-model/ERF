name: Linux GCC NetCDF RRTMGP

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || github.sha }}-linux-gcc-rrtmgp
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  library:
    name: GNU@9.3 C++17 - NetCDF ${{matrix.netcdf}} - Particles ${{matrix.particles}} - RRTMGP ${{matrix.rrtmgp}}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    # env: {CXXFLAGS: "-fno-operator-names -Werror -Wall -Wextra -Wpedantic -Wnull-dereference -Wfloat-conversion -Wshadow -Woverloaded-virtual"}
    strategy:
      fail-fast: false
      matrix:
        # This workflow exercises the NetCDF and RRTMGP combinations, which
        # are orthogonal to particles -- crossing the axis doubled the matrix
        # for no added coverage of either. Particles OFF is still built by
        # ci, gcc and windows-mpi.
        particles: [ON]
        # PR tier: NetCDF+RRTMGP only. The NetCDF-OFF (= gcc.yml + Kokkos) and NetCDF-only
        # variants build on merge to development.
        netcdf: ${{ fromJSON(github.event_name == 'pull_request' && '["ON"]' || '["OFF", "ON"]') }}
        rrtmgp: ${{ fromJSON(github.event_name == 'pull_request' && '["ON"]' || '["OFF", "ON"]') }}
        exclude:
        - rrtmgp: ON
          netcdf: OFF
    env:
      ERF_DIR: ${{ github.workspace }}/erf_clone
    steps:

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        path: erf_clone

    - name: Install Dependencies
      run: ${ERF_DIR}/Submodules/AMReX/.github/workflows/dependencies/dependencies.sh

    - name: Install CCache
      run: ${ERF_DIR}/Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    - name: Free up disk space
      uses: ./erf_clone/.github/actions/free-space-ubuntu

    # ccache per matrix variant, written only from development; see ci.yml for how it works.
    - name: Restore Cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.netcdf }}-${{ matrix.rrtmgp }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.netcdf }}-${{ matrix.rrtmgp }}-git-

    - name: Setup Spack
      uses: spack/setup-spack@v3
      with:
        spack_path: ${{ github.workspace }}/spack_install_dir
        # Pinned so the package recipes stop drifting between runs. Jobs have been
        # installing OpenMPI with different hashes (recipes on develop plus reuse
        # from the public build cache); different installed headers make ccache
        # miss every file that includes mpi.h. The pin removes the drift over
        # time; identical specs within one run need a project build cache.
        spack_ref: cd657f2c90770f5722715f6a0f95d7a5a359359b
        packages_ref: fa11df3be41f58bac19b73346422e06b103ee5b5

    - name: Install CA certificates
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates
        sudo update-ca-certificates

    - name: set up NetCDF
      run: |
        echo ${{ github.workspace }}
        echo ${{ runner.workspace }}
        . ${{ github.workspace }}/spack_install_dir/share/spack/setup-env.sh
        export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
        export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
        export CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
        spack env create erf_netcdf
        spack env activate erf_netcdf
        # Every job must install the identical spec. Spack concretizes for the host
        # CPU by default (seen: x86_64_v4, icelake, zen2, one per runner type), which
        # changes the hash, the install path, and with it every ccache key that
        # includes mpi.h. x86_64_v3 (AVX2) runs on every GitHub runner.
        spack config add "packages:all:require:target=x86_64_v3"
        spack add netcdf-c netcdf-fortran parallel-netcdf hdf5 openmpi
        spack concretize -f
        # Project binary cache on GHCR. Every job pulls from it; non-PR runs push to
        # it below (a fork PR's token is read-only, so it can only pull). The public
        # Spack cache has no binaries for these specs, so without this every job
        # compiles OpenMPI, HDF5 and NetCDF from source (20-70 min). Binaries are
        # keyed by spec hash, which the target pin above keeps identical across runners.
        spack mirror add --unsigned \
          --oci-username-variable GHCR_USER --oci-password-variable GHCR_TOKEN \
          erf-buildcache oci://ghcr.io/${{ github.repository_owner }}/spack-buildcache
        spack install --deprecated
        spack find -lv openmpi hdf5 netcdf-c parallel-netcdf
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Project and Generate Build System
      run: |
        . ${{ github.workspace }}/spack_install_dir/share/spack/setup-env.sh
        spack env activate erf_netcdf
        export HDF5_ROOT=$(spack location -i hdf5)
        export NETCDF_ROOT=$(spack location -i netcdf-c)
        cmake \
          -B${ERF_DIR}/build \
          -DCMAKE_INSTALL_PREFIX:PATH=${ERF_DIR}/install \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DAMReX_ASSERTIONS:BOOL=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_PARALLEL_TEST_ALLOW_OVERSUBSCRIBE:BOOL=ON \
          '-DERF_PARALLEL_TEST_NRANKS:STRING=1;2;4' \
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} \
          -DERF_ENABLE_NETCDF:BOOL=${{matrix.netcdf}} \
          -DERF_ENABLE_HDF5:BOOL=${{matrix.netcdf}} \
          -DERF_ENABLE_KOKKOS:BOOL=ON \
          -DHDF5_ROOT=${HDF5_ROOT} \
          -DNETCDF_ROOT=${NETCDF_ROOT} \
          -DERF_ENABLE_EKAT:BOOL=${{matrix.rrtmgp}} \
          -DERF_ENABLE_RRTMGP:BOOL=${{matrix.rrtmgp}} \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          ${ERF_DIR};

    - name: Compile and Link
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z
        build_start=$(date +%s)

        cmake --build ${ERF_DIR}/build --parallel 2 --verbose \
        2>&1 | tee -a ${ERF_DIR}/build-output.txt;

        echo '```' >> "$GITHUB_STEP_SUMMARY"
        # Keep only what this build used: ccache touches an object on every hit, so
        # anything older than the build is stale. Without this the cache fills with
        # objects from superseded commits, hits its cap, and evicts live objects.
        ccache --evict-older-than "$(( $(date +%s) - build_start + 120 ))s"
        ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        du -hs ~/.cache/ccache

    - name: Save Cache
      if: always() && github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.netcdf }}-${{ matrix.rrtmgp }}-git-${{ github.sha }}

    - name: Report
      run: |
        grep -Ei "warning:|error:" ${ERF_DIR}/build-output.txt \
          | grep -Ev "Submodules/(amrex|googletest)" | grep -Ev "lto-wrapper: warning:" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${ERF_DIR}/build-output-warnings.txt
        cat ${ERF_DIR}/build-output-warnings.txt
        export return=$(tail -n 1 ${ERF_DIR}/build-output-warnings.txt | awk '{print $2}')
        exit ${return}

    - name: Check Unit Test Registration
      run: |
        Tests/Unit/erf_unit_tests --gtest_list_tests | tee ${{ github.workspace }}/unit-test-list.txt
        grep -Eq '^[A-Za-z0-9_].*\.$' ${{ github.workspace }}/unit-test-list.txt
      working-directory: ${{ github.workspace }}/erf_clone/build

    - name: Run Serial Unit Tests
      run: |
        ctest -L unit --output-on-failure --no-tests=error
      working-directory: ${{ github.workspace }}/erf_clone/build

    - name: Run Parallel Tests
      run: |
        ctest -L parallel --output-on-failure --no-tests=error
      working-directory: ${{ github.workspace }}/erf_clone/build

    - name: CMake Regression Tests # see file ERF/Tests/CTestList.cmake
      run: |
        ctest -L regression -VV
      working-directory: ${{ github.workspace }}/erf_clone/build

    # A test that dies on a signal (for example SIGILL from amrex.fpe_trap_invalid)
    # writes Backtrace.<rank> into its run directory; the log only says "See
    # Backtrace.0 file for details", so keep those files when a step has failed.
    - name: Upload backtraces from failed tests
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: backtraces-gcc-rrtmgp-netcdf-${{matrix.netcdf}}-rrtmgp-${{matrix.rrtmgp}}
        path: ${{ github.workspace }}/erf_clone/build/Tests/**/Backtrace.*
        if-no-files-found: ignore
        retention-days: 14

    # Share the Spack binaries with later runs. Runs after the build and tests, and a
    # registry problem must not turn a good build red, so it only warns on failure.
    # Build-only dependencies (bison, util-macros, ...) are not installed when
    # binaries were reused, so they are left out; everything ERF links against is in.
    - name: Push Spack binaries to GHCR
      if: always() && github.event_name != 'pull_request'
      continue-on-error: true
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        . ${{ github.workspace }}/spack_install_dir/share/spack/setup-env.sh
        spack env activate erf_netcdf
        spack buildcache push --unsigned --update-index --without-build-dependencies erf-buildcache
