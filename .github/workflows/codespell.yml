name: codespell

on:
  # Fork feature pushes provide pre-PR CI; all fork development pushes are intentionally skipped.
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-codespell
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  codespell:
    # GitHub currently leaves skipped-job names raw; this fallback stays distinct if evaluated.
    name: >-
      ${{ ((github.event_name == 'pull_request' && !github.event.repository.fork) ||
           (github.event_name == 'push' &&
            github.event.repository.fork == (github.ref != 'refs/heads/development')))
          && 'codespell' || 'codespell [policy skipped]' }}
    if: >-
      (github.event_name == 'pull_request' && !github.event.repository.fork) ||
      (github.event_name == 'push' &&
       github.event.repository.fork == (github.ref != 'refs/heads/development'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install codespell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pip
          pip3 install --user codespell

      - name: Run codespell
        run: codespell
