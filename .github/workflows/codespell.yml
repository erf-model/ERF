name: codespell

on:
  # Fork pushes provide pre-PR CI; jobs below skip canonical feature-branch pushes.
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-codespell
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  codespell:
    # The closed event exists only to cancel in-progress runs via concurrency.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'push' || github.repository != 'erf-model/ERF' ||
       github.ref == 'refs/heads/development')
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install codespell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pip
          pip3 install --user codespell

      - name: Run codespell
        run: codespell
