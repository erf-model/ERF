name: CI metrics

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        default: "7"

permissions:
  contents: read
  actions: read

jobs:
  metrics:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days || '7' }}
        run: python3 .github/workflows/metrics/ci_metrics.py --repo "$GITHUB_REPOSITORY" --days "$DAYS"
