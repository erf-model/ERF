name: ERF CI (hip)

on:
  push:
    branches: [development]
    paths:
      - '**'
      - '!Docs/**'
      - '!**.md'
      - '!**.rst'
      - '!license.txt'
      - '!.github/workflows/**'
      - '.github/workflows/hip.yml'
      - '.github/actions/**'

  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened]
    paths:
      - '**'
      - '!Docs/**'
      - '!**.md'
      - '!**.rst'
      - '!license.txt'
      - '!.github/workflows/**'
      - '.github/workflows/hip.yml'
      - '.github/actions/**'
  workflow_dispatch:

# Development pushes finish the active run and keep only the newest pending commit.
# PR cancellation and commit-specific manual groups stay unchanged.
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || (github.event_name == 'push' && 'latest') || github.sha }}-hip
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  # MPI_C is broken since HIP 4.1
  # https://gitlab.kitware.com/cmake/cmake/-/issues/21968
  # https://github.com/ROCm-Developer-Tools/HIP/issues/2246
  Build-And-Test-HIP:
    name: HIP ROCm GFortran@9.3 C++17 - Mesh ${{matrix.mesh_precision}} Particles ${{matrix.particles}} ${{matrix.particles_precision}}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    # Have to have -Wno-deprecated-declarations due to deprecated atomicAddNoRet
    # Have to have -Wno-gnu-zero-variadic-macro-arguments to avoid
    #    amrex/Src/Base/AMReX_GpuLaunchGlobal.H:15:5: error: must specify at least one argument for '...' parameter of variadic macro [-Werror,-Wgnu-zero-variadic-macro-arguments]
    #        __launch_bounds__(amrex_launch_bounds_max_threads)
    #        ^
    #    /opt/rocm-4.1.1/hip/include/hip/hcc_detail/hip_runtime.h:178:71: note: expanded from macro '__launch_bounds__'
    #        select_impl_(__VA_ARGS__, launch_bounds_impl1, launch_bounds_impl0)(__VA_ARGS__)
    #                                                                          ^
    #    /opt/rocm-4.1.1/hip/include/hip/hcc_detail/hip_runtime.h:176:9: note: macro 'select_impl_' defined here
    #    #define select_impl_(_1, _2, impl_, ...) impl_
    # NOTE: -Werror was removed because ERF specifically had a lot of warnings. It will be a separate task to go through and fix them all...
    env:
      CXXFLAGS: "-Wall -Wextra -Wpedantic -Wnull-dereference -Wfloat-conversion -Wshadow -Woverloaded-virtual -Wextra-semi -Wunreachable-code -Wno-deprecated-declarations -Wno-gnu-zero-variadic-macro-arguments -Wno-pass-failed"
      CCACHE_TRUNK_KEY: ubuntu-22.04-x64-rocm-${{ matrix.rocm_version }}-gfx908-openmpi-${{ matrix.mesh_precision }}-particles-on
    strategy:
      fail-fast: false
      matrix:
        # Use the same version for dependency installation and the GHCR tag.
        rocm_version: ["6.3.2"]
        # GPU builds cover the particle-enabled configuration only. The
        # particles-OFF variant costs a second long GPU compile for solver
        # coverage the particles-ON build already provides; it is still built
        # on CPU by ci, gcc and windows-mpi.
        particles: [ON]
        particles_precision: [DOUBLE, SINGLE]
        # PR tier: DOUBLE only. SINGLE builds on merge to development (which also writes its ccache).
        mesh_precision: ${{ fromJSON(github.event_name == 'pull_request' && '["DOUBLE"]' || '["DOUBLE", "SINGLE"]') }}
        exclude:
          # Only matching mesh/particle precisions are tested, i.e. DOUBLE mesh
          # with DOUBLE particles and SINGLE mesh with SINGLE particles.
          - mesh_precision: DOUBLE
            particles_precision: SINGLE
          - mesh_precision: SINGLE
            particles_precision: DOUBLE

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false

    - name: Free up disk space
      uses: ./.github/actions/free-space-ubuntu

    - name: Dependencies
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_hip.sh "${{ matrix.rocm_version }}"

    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    # GHCR trunk per configuration; the old Actions cache seeds the first restore.
    - name: Restore Cache
      id: ghcr-cache
      uses: ./.github/actions/ccache-trunk
      with:
        mode: restore
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ~/.cache/ccache
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore legacy Actions cache
      if: steps.ghcr-cache.outputs.hit != 'true'
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-${{ matrix.mesh_precision }}-git-

    - name: Build & Install
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        ccache -z
        build_start=$(date +%s)

        source /etc/profile.d/rocm.sh
        hipcc --version
        which clang
        which clang++
        which flang

        cmake \
          -B${{runner.workspace}}/ERF/build-${{matrix.os}} \
          -DCMAKE_VERBOSE_MAKEFILE=ON                   \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_ENABLE_HIP:BOOL=ON \
          -DAMReX_AMD_ARCH=gfx908 \
          -DERF_ENABLE_PARTICLES:BOOL=${{matrix.particles}} \
          -DERF_PRECISION:STRING=${{matrix.mesh_precision}} \
          -DERF_PARTICLES_PRECISION:STRING=${{matrix.particles_precision}} \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          -DCODECOV:BOOL=ON \
          -DCMAKE_C_COMPILER="$(which clang)"             \
          -DCMAKE_CXX_COMPILER="$(which clang++)"         \
          -DCMAKE_Fortran_COMPILER="$(which flang)"       \
          -DCMAKE_CXX_STANDARD=17 \
          ${{github.workspace}};
        # ${{matrix.mpipreflags}} \

        # for some reason this cmake command fails to build the code,
        # and we need to use the make command that follows instead ...
        # cmake --build ${{runner.workspace}}/ERF/build-${{matrix.os}} --parallel ${{env.NPROCS}};

        pushd ${{runner.workspace}}/ERF/build-${{matrix.os}};
        # Compile the two big object libraries on every core, then finish (test
        # objects and all the links) at -j 2. HIP device links are memory-hungry:
        # with -j 4 two links ran side by side and the runner VM was shut down
        # (out of memory) 13 minutes into linking erf_parallel_tests.
        make -j "$(nproc)" amrex_3d erf_srclib 2>&1 | tee -a ${{runner.workspace}}/build-${{matrix.os}}-output.txt;
        make -j 2 2>&1 | tee -a ${{runner.workspace}}/build-${{matrix.os}}-output.txt;

        echo '```' >> "$GITHUB_STEP_SUMMARY"
        # Keep only what this build used: ccache touches an object on every hit, so
        # anything older than the build is stale. Without this the cache fills with
        # objects from superseded commits, hits its cap, and evicts live objects.
        ccache --evict-older-than "$(( $(date +%s) - build_start + 120 ))s"
        ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        du -hs ~/.cache/ccache

    - name: Save Cache
      if: always() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
      uses: ./.github/actions/ccache-trunk
      with:
        mode: save
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ~/.cache/ccache
        token: ${{ secrets.GITHUB_TOKEN }}


    - name: Report
      run: |
        grep -Ei "warning:|error:" ${{runner.workspace}}/build-${{matrix.os}}-output.txt \
          | grep -Ev "Submodules/(amrex|AMReX|googletest)" | grep -Ev "lto-wrapper: warning:" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-${{matrix.os}}-output-warnings.txt
        cat ${{runner.workspace}}/build-${{matrix.os}}-output-warnings.txt
        return=$(tail -n 1 ${{runner.workspace}}/build-${{matrix.os}}-output-warnings.txt | awk '{print $2}')
        exit ${return}

    # - name: Regression Tests
    #   run: |
    #     ctest -L regression -VV
    #   working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}

    # - name: Generate coverage report
    #   working-directory: ${{runner.workspace}}/ERF/build-${{matrix.os}}
    #   run: |
    #     find . -type f -name '*.gcno' -path "**Source**" -exec gcov -pb {} +
    #     cd ..
    #     gcovr -g -k -r . --xml regressioncov.xml  # -v

    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v4
    #   with:
    #     dry_run: false
    #     # token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
    #     files: ./regressioncov.xml # optional
    #     flags: regtests # optional
    #     # name: codecov-umbrella # optional
    #     fail_ci_if_error: true # optional (default = false)
    #     verbose: true # optional (default = false)
    #     directory: ${{runner.workspace}}/ERF

    - name: Success artifacts
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: build-and-test
        path: |
          ${{runner.workspace}}/ERF/regressioncov.xml
    - name: Failing test artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: build-and-test
        path: |
          ${{runner.workspace}}/ERF/regressioncov.xml
