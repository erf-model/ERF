# Usage: code-scribe update ERF_NOAHMP.cpp ERF_NOAHMP.H \
#                           -p specs/noahmpio_update.toml \
#                           -q "Write a natural language prompt with variable name dimension etc." \
#                           -m <openai|argo|..>
#
# Documentation: https://erf.readthedocs.io/en/latest/CouplingToNoahMP.html

[[chat.user]]
content = '''
You are a code-update assistant for extending the ERF-NoahMP C++ driver interface.

Only edit the appended files (ERF_NOAHMP.cpp and ERF_NOAHMP.H). Focus on the
coupling logic inside `NOAHMP::Advance_With_State()`, the buffer allocation in
`NOAHMP::Init()`, and the component enums in the header. Preserve the existing
loop structure, the component-indexed buffer layout, and the CPU-GPU data flow.

Maintain the same variable naming conventions, memory ordering, and data transfer
patterns used for existing variables such as `U_PHY`, `V_PHY`, `T_PHY`, `QV_CURR`,
`SWDOWN`, `GLW`, and `TSK`.

1. Context

-  The ERF-NoahMP coupling exchanges field data via `noahmpio_vect`, a per-tile
   vector of `NoahmpIO_type` objects. Each object corresponds to a domain tile
   (local box) in `cons_in`, indexed by `idb`.

-  Forcing and output are staged through two host-accessible (pinned) buffers that
   are allocated once per tile in `NOAHMP::Init()` and reused every step:

   ```
   noahmp_input_tmp[idb]  = std::make_unique<FArrayBox>(bx, NoahmpInputComp::NumComps , The_Pinned_Arena());
   noahmp_output_tmp[idb] = std::make_unique<FArrayBox>(bx, NoahmpOutputComp::NumComps, The_Pinned_Arena());
   ```

   These are multi-component FArrayBoxes: each coupled field occupies one component,
   selected by an entry in the `NoahmpInputComp` / `NoahmpOutputComp` enums declared
   in ERF_NOAHMP.H. There is NO per-variable FArrayBox; do not allocate one.

-  The `NoahmpInputComp` enum lists fields copied ERF -> NoahMP (forcing inputs).
   The `NoahmpOutputComp` enum lists fields copied NoahMP -> ERF (computed outputs).
   Each enum ends with a `NumComps` sentinel that sizes the buffers above.

-  NoahMP array index ordering (note the transposed k axis):
   - 3D atmospheric fields use (i, k, j) with k pinned to the surface layer 1,
     e.g. `noahmpio->T_PHY(i,1,j)`.
   - 2D surface fields use (i, j), e.g. `noahmpio->TSK(i,j)`.
   - Banded radiation fields use (i, band, j), e.g. `noahmpio->ALBSFCDIRXY(i,1,j)`
     for VIS and `(i,2,j)` for NIR.

-  Each time step, `Advance_With_State()` performs the following sequence per tile:
   (1) Get Array4<const Real> views of ERF state (CONS, U_PHY, V_PHY) and the
         lsm coupling data (SWDOWN, GLW, COSZEN from `lsm_fab_data`).
   (2) Get the staging buffer handles:
         `Array4<Real> noah_input_arr  = noahmp_input_tmp[idb]->array();`
         `Array4<Real> noah_output_arr = noahmp_output_tmp[idb]->array();`
   (3) ParallelFor over `bx` (GPU): write each forcing field into its input
         component, e.g.
         `noah_input_arr(i,j,0,NoahmpInputComp::t_phy) = getTgivenRandRTh(...);`
   (4) `Gpu::streamSynchronize();` then `LoopOnCpu` over `bx` to copy each input
         component into the matching NoahMP field, e.g.
         `noahmpio->T_PHY(i,1,j) = noah_input_arr(i,j,0,NoahmpInputComp::t_phy);`
   (5) `noahmpio->itimestep += 1; noahmpio->DriverMain();`
   (6) `LoopOnCpu` over `bx` to copy each NoahMP output into its output component,
         e.g. `noah_output_arr(i,j,0,NoahmpOutputComp::tsk) = noahmpio->TSK(i,j);`
   (7) ParallelFor over `gbx` (GPU): copy each output component into the ERF field
         (an `lsm_fab_data` coupling var or an `lsm_fab_flux` var), clamping indices
         to (ii,jj) and honoring the -9999 fill handling for fluxes.

2. Task Details

Update `Advance_With_State()`, `Init()`, and the header enums to include and
correctly link new NoahmpIO variables and any other surface fields needed for the
ERF side.

Changes Required

-  Component enum (ERF_NOAHMP.H)
   Add the new field to `NoahmpInputComp` (if it is forcing into NoahMP) or
   `NoahmpOutputComp` (if it is computed by NoahMP), placed before `NumComps`:
      NoahmpInputComp:  ..., glw, coszen, newvar, NumComps
   The buffers in `Init()` size themselves off `NumComps`, so no buffer-size edit
   is needed.

-  Device->Host copy (ParallelFor over `bx`)  [inputs only]
   If the new field originates on the ERF side, write it into the input component
   in the existing ParallelFor block:
      noah_input_arr(i,j,0,NoahmpInputComp::newvar) = <ERF source expression>;
   If it is computed by NoahMP, skip this and handle it in the copy-back section.

-  Host->NoahMP copy (LoopOnCpu over `bx`)  [inputs only]
   After `Gpu::streamSynchronize()`, extend the LoopOnCpu block that writes NoahMP
   fields, using the correct index ordering for the field rank:
      noahmpio->NEWVAR(i,1,j) = noah_input_arr(i,j,0,NoahmpInputComp::newvar);  // 3D
      noahmpio->NEWVAR(i,j)   = noah_input_arr(i,j,0,NoahmpInputComp::newvar);  // 2D

-  NoahMP->Host copy (LoopOnCpu over `bx`)  [outputs only]
   In the post-`DriverMain()` LoopOnCpu block, read the NoahMP field into the
   output component:
      noah_output_arr(i,j,0,NoahmpOutputComp::newvar) = noahmpio->NEWVAR(i,j);

-  Host->Device copy-back (ParallelFor over `gbx`)  [outputs only]
   Assign the output component into the correct ERF field, using the clamped
   indices (ii,jj):
      DEST(i,j,0) = noah_output_arr(ii,jj,0,NoahmpOutputComp::newvar);
   If the field is a surface-layer flux divided by a state factor, follow the
   `t_flux`/`q_flux`/`tau13`/`tau23` pattern, including the `-9999` fill guard that
   writes `lsm_flux_undefined` for cells NoahMP does not process.

-  Coupling-field plumbing (only if the ERF destination is a NEW coupling/flux var)
   If `DEST` is not an existing `lsm_fab_data` / `lsm_fab_flux` field, add it to the
   `LsmData_NOAHMP` (or `LsmFlux_NOAHMP`) enum in ERF_NOAHMP.H, then register it in
   `Init()` by extending `LsmDataMap`/`LsmDataName` (or the flux equivalents) and the
   allocation/initialization loop. Existing coupling fields need no such change.

Follow the same block and comment style used for variables like TSK, EMISS, and
HFX, and maintain case sensitivity exactly as implemented for other variables.

3. Validation

-  Verify array ranks and index ordering match (3D atmospheric -> (i,1,j),
   2D surface -> (i,j), banded radiation -> (i,band,j); ERF Array4 surface fields
   use (i,j,0)).
-  Confirm every new field has both an enum entry and a matching read/write in each
   relevant copy block, so component indices stay one-to-one with `NumComps`.
-  Ensure the order of CPU/GPU synchronization (`Gpu::streamSynchronize()` before
   host access, ParallelFor copy-back after `DriverMain()`) is preserved.
-  Confirm `noahmpio_vect` indexing (`idb`), the `bx.smallEnd(2) != klo` slab guard,
   and the (ii,jj) index clamping remain untouched.
-  Maintain one-to-one consistency between ERF arrays and NoahMP I/O variables.

4. Actual Task

Modify and link the requested variables.

Ensure each field is fully integrated into the ERF-NoahMP coupling sequence inside
`Advance_With_State()` (and the buffers/enums it depends on) following the memory
flow used for TSK.

'''
