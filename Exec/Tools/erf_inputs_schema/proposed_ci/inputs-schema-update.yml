# PROPOSED, not active, and only useful if a generated schema is committed to the repository (an open question for
# the owner). To enable, move this file to .github/workflows/ and choose the committed path (SCHEMA below).
#
# Inputs Schema Update: after merges to development, regenerate the committed schema with ERF's default options and
# open (or update) one PR from bot/inputs-schema. Nothing is pushed to development directly. The pattern is REMORA's
# generic-inputs-update.yml (#704), including its GitHub App token (INPUTS_BOT_CLIENT_ID / INPUTS_BOT_PRIVATE_KEY in
# an inputs-bot environment limited to development), so that CI runs on the bot PR and no Actions setting is needed.

name: Inputs Schema Update

on:
  push:
    branches: [development]
    paths:
      - "Source/**"
      - "Submodules/AMReX"
      - "CMakeLists.txt"
      - "CMake/**"
      - "Exec/Tools/build_erf_schema.py"
      - "Exec/Tools/erf_inputs_schema/**"
  workflow_dispatch:

concurrency:
  group: inputs-schema-update
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEMA: Exec/Tools/erf_inputs_schema/current/erf_inputs_schema.json   # to be decided by the owner

jobs:
  update-inputs-schema:
    if: github.repository == 'erf-model/ERF'
    runs-on: ubuntu-latest
    environment: inputs-bot
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Regenerate the schema
        run: |
          python3 -m unittest discover -s Exec/Tools/erf_inputs_schema/tests
          mkdir -p "$(dirname "$SCHEMA")"
          python3 Exec/Tools/build_erf_schema.py --repo . --erf HEAD --out "$SCHEMA"

      - name: Get a token for the bot App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.INPUTS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.INPUTS_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the bot PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/inputs-schema
          commit-message: "Regenerate the inputs schema"
          title: "Regenerate the inputs schema"
          body: "Regenerated by Exec/Tools/build_erf_schema.py after a merge to development (ERF's default options)."
          add-paths: ${{ env.SCHEMA }}
